services:
  api:
    build: .
    container_name: mental-api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongo-db
    restart: always
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: